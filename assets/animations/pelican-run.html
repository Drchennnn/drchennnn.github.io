<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕，冲呀！ · Pelican on the run</title>
<style>
:root{color-scheme:light;--ink:#293d37;--muted:#748179;--paper:#faf9f4;--green:#438775;--line:#dce4da}
*{box-sizing:border-box}body{margin:0;background:#e9ede4;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px}main{width:min(1080px,100%);background:var(--paper);border:1px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 80px #344a3520}header{padding:32px 42px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:12px;letter-spacing:3px;font-weight:650;display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:#67a58d}.tag{border:1px solid var(--line);border-radius:30px;padding:7px 12px;font-size:11px;letter-spacing:1.4px;color:var(--muted)}.intro{padding:30px 42px 0;position:relative;z-index:1;pointer-events:none}h1{font-size:clamp(28px,4.5vw,46px);letter-spacing:-2px;margin:0 0 10px;font-weight:750}.intro p{margin:0;color:var(--muted);font-size:14px;letter-spacing:1px}.stage{margin-top:-36px;position:relative}.stage svg{display:block;width:100%;height:auto;overflow:hidden}.motion-note{position:absolute;bottom:28px;left:42px;font-size:11px;letter-spacing:2px;color:#87948a}.controls{margin:0 42px 28px;padding-top:24px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr auto;gap:32px;align-items:center}.label{font-size:14px;font-weight:650}.sub{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:1px}.range-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)}output{font-variant-numeric:tabular-nums;color:var(--green);font-weight:700;font-size:17px}input{width:100%;height:26px;accent-color:var(--green);cursor:pointer;margin:0;touch-action:pan-y}.range-labels{display:flex;justify-content:space-between;font-size:10px;color:#8a958d;margin-top:4px}button{font:inherit;font-size:13px;border:1px solid #cddbd1;border-radius:50px;background:transparent;color:var(--ink);padding:13px 20px;cursor:pointer;min-width:96px}button:hover{background:#e7eee5}button:focus-visible,input:focus-visible{outline:3px solid #91b6a1;outline-offset:4px}footer{display:flex;justify-content:space-between;margin:0 42px 24px;color:#99a198;font-size:10px;letter-spacing:1.5px}.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}.paused .blink{animation-play-state:paused}
@media(max-width:600px){body{padding:12px}main{border-radius:20px}header{padding:22px 22px 0}.brand{font-size:10px;letter-spacing:2px}.tag{font-size:9px;padding:6px 8px}.intro{padding:25px 22px 0}.intro p{font-size:12px}.stage{margin-top:0}.stage svg{width:140%;max-width:none;margin-left:-20%}.motion-note{left:22px;bottom:10px;font-size:8px}.controls{margin:12px 22px 24px;gap:16px;grid-template-columns:1fr auto}.range{grid-row:2;grid-column:1/-1}.sub{font-size:10px}footer{margin:0 22px 20px;font-size:8px}.controls button{grid-row:1;grid-column:2}h1{letter-spacing:-1px}}
</style>

 <path d="M-90-89Q-108-132-92-162Q-122-172-116-212Q-112-222-101-213L-62-190Q1-230 64-190L106-216Q126-228 116-187L107-165Q127-147 105-132Q117-115 96-108L87-39Q79-5 65-1L69-108 48-117 42-96Q25-104 22-136L16-99-14-100-31-144-43-103-57-108-62-80Q-66-29-82-18L-93-44Z" fill="#d9cdb7"/>

 <!-- recognizable bird hair clip -->

</g></g>
<g transform="translate(737 144) rotate(9)" fill="none" stroke="#89aa88" stroke-width="3" stroke-linecap="round"><path d="M-3 9L4-3M10 16l13-5M12 28l12 3"/></g>

<section class="controls" aria-label="动画控制">

<div class="range"><div class="range-title"><label for="speed">狂奔节奏</label><output for="speed" id="speedValue">1.0×</output></div><input id="speed" type="range" min="0" max="3" step="0.1" value="1" aria-label="狂奔速度"><div class="range-labels"><span>静止</span><span>屈膝奔跑</span><span>旋风腿！</span></div></div>

</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const slider=$('speed'),output=$('speedValue'),button=$('pause'),app=$('app');
const runner=$('runner'),hair=$('hairBack'),saw=$('saw'),coat=$('coat'),shadow=$('shadow'),chain=$('chain');
const ns='http://www.w3.org/2000/svg';
function make(parent,tag,attrs={}){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);$(parent).append(e);return e;}
const dust=Array.from({length:7},()=>make('dust','ellipse'));
const streaks=Array.from({length:8},()=>make('streaks','path'));
const legParts=['legFar','legNear'].map(id=>{const e=$(id);return {thigh:e.querySelector('.thigh'),shin:e.querySelector('.shin'),boot:e.querySelector('.boot')};});
const trails=Array.from({length:6},()=>make('legTrails','path',{'stroke':'#726d58','stroke-width':19}));
const haze=Array.from({length:3},()=>make('spinHaze','ellipse',{cx:0,cy:106,rx:65,ry:33,opacity:.15}));
const arcs=Array.from({length:10},(_,i)=>make('spinArcs','path',{stroke:['#514d3f','#998d70','#c5b995','#36433b'][i%4],'stroke-width':i%3===0?7:3}));
const spinShoes=Array.from({length:3},()=>make('spinShoes','path',{d:'M-13-5Q-9-10 0-7L13-2Q20 5 10 8L-15 5Z',fill:'#38423a'}));
const spinLines=Array.from({length:6},()=>make('spinLines','path'));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const x=clamp((v-a)/(b-a),0,1);return x*x*(3-2*x);};
let speed=1,velocity=1,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,phase=0,last=0;
function update(){speed=Number(slider.value);output.value=speed.toFixed(1)+'×';slider.setAttribute('aria-valuetext',speed.toFixed(1)+' 倍速度');button.textContent=paused?'▶ 继续':'Ⅱ 暂停';button.setAttribute('aria-pressed',String(paused));app.classList.toggle('paused',paused||speed===0);$('status').textContent=paused?'暂停一下，蓄力再出发':speed===0?'站稳，准备出发':speed<.8?'轻轻迈步 · 自然屈膝':speed>=2.6?'旋风腿！全速前进':speed>1.65?'加速！双腿逐渐化成残影':'抬腿，加速向前！';}
slider.addEventListener('input',update);button.addEventListener('click',()=>{paused=!paused;update();});
document.addEventListener('visibilitychange',()=>{last=0;});
// Forward kinematics: each shin starts at the exact endpoint of its thigh.
// Positive knee flexion folds the foot backward (left); phase offsets alternate legs.
function pose(p,side,v){
 const effort=smooth(0,2.4,v),amp=21+effort*44;
 const hip=(-Math.cos(p)*amp-5)*Math.PI/180;
 const knee=(9+(30+effort*91)*Math.pow((1+Math.sin(p))/2,2))*Math.PI/180;
 const h={x:side? -18:16,y:62};
 const k={x:h.x-Math.sin(hip)*35,y:h.y+Math.cos(hip)*35};
 const a={x:k.x-Math.sin(hip+knee)*34,y:k.y+Math.cos(hip+knee)*34};
 return {h,k,a,foot:clamp((hip+knee)*180/Math.PI*.45,-30,65)};
}
const point=p=>`${p.x.toFixed(3)} ${p.y.toFixed(3)}`;
function arcPath(cx,cy,rx,ry,start,length){const end=start+length;return `M${cx+rx*Math.cos(start)} ${cy+ry*Math.sin(start)}A${rx} ${ry} 0 ${length>Math.PI?1:0} 1 ${cx+rx*Math.cos(end)} ${cy+ry*Math.sin(end)}`;}
function draw(t){
 const p=t*Math.PI*2,effort=smooth(0,2.4,velocity),blend=smooth(1.65,2.85,velocity);
 const bob=-(1-Math.cos(p*2))*.5*(4+effort*9)*(1-blend*.75);
 runner.setAttribute('transform',`translate(0 ${bob}) rotate(${3+effort*3+Math.sin(p)*1.2*(1-blend)})`);
 legParts.forEach((leg,i)=>{const q=pose(p+i*Math.PI,i,velocity);leg.thigh.setAttribute('d',`M${point(q.h)}L${point(q.k)}`);leg.shin.setAttribute('d',`M${point(q.k)}L${point(q.a)}`);leg.boot.setAttribute('transform',`translate(${point(q.a)}) rotate(${q.foot})`);});
 $('legs').setAttribute('opacity',String(1-smooth(.22,1,blend)));
 $('legBlurAmount').setAttribute('stdDeviation',String(blend*1.5));
 trails.forEach((e,i)=>{const q=pose(p-(1+Math.floor(i/2))*.19+(i%2)*Math.PI,i%2,velocity);e.setAttribute('d',`M${point(q.h)}L${point(q.k)}L${point(q.a)}`);e.setAttribute('opacity',String(smooth(.9,2,velocity)*(1-blend)*(.16-Math.floor(i/2)*.035)));});
 $('legSpin').setAttribute('opacity',String(blend));
 const rx=59+blend*17,ry=29+blend*8,cy=105;
 haze.forEach((e,i)=>{e.setAttribute('rx',String(rx-i*9));e.setAttribute('ry',String(ry-i*5));e.setAttribute('cy',String(cy));});
 arcs.forEach((e,i)=>{const angle=p*1.65+i*2.399;e.setAttribute('d',arcPath(-3,cy,rx-(i%3)*7,ry-(i%3)*4,angle,1.2+(i%3)*.42));e.setAttribute('opacity',String(.42+(i%3)*.18));});
 spinShoes.forEach((e,i)=>{const angle=p*1.65+i*Math.PI*2/3;e.setAttribute('transform',`translate(${-3+rx*Math.cos(angle)} ${cy+ry*Math.sin(angle)}) rotate(${Math.atan2(ry*Math.cos(angle),-rx*Math.sin(angle))*180/Math.PI})`);e.setAttribute('opacity',String(.52+i*.12));});
 spinLines.forEach((e,i)=>{const f=(t*1.7+i/6)%1,x=-45-f*120,y=83+i*10;e.setAttribute('d',`M${x} ${y}q-16 -3 ${-25-i*3} 0`);e.setAttribute('opacity',String((1-f)*.65));});
 hair.setAttribute('transform',`rotate(${Math.sin(p-.6)*(2+effort*3)-5-effort*3} 0 -120)`);coat.setAttribute('transform',`rotate(${Math.sin(p+.5)*2} 0 0)`);
 saw.setAttribute('transform',`translate(60 -225) rotate(8) scale(-1 1)`);chain.setAttribute('stroke-dashoffset',String(-t*260));
 shadow.setAttribute('rx',String(76+blend*25-Math.abs(Math.sin(p))*8*(1-blend)));shadow.setAttribute('opacity',String(.13-Math.abs(Math.sin(p))*.025));
 $('grass').setAttribute('patternTransform',`translate(${-t*140%140} 0)`);
 dust.forEach((e,i)=>{const a=(t*.8+i/7)%1;e.setAttribute('cx',String(443-a*(130+effort*85)));e.setAttribute('cy',String(458-Math.sin(a*Math.PI)*(18+effort*16)));e.setAttribute('rx',String(5+a*14));e.setAttribute('ry',String(4+a*8));e.setAttribute('opacity',String((1-a)*(.2+effort*.35)));});
 streaks.forEach((e,i)=>{const a=(t*.7+i/8)%1,x=830-a*670,y=252+(i%4)*53;e.setAttribute('d',`M${x} ${y}h${(12+(i%3)*15)*(1+effort)}`);e.setAttribute('opacity',String(Math.sin(a*Math.PI)*(.12+effort*.25)));});
 // Read-only diagnostics make transition and kinematic checks reproducible.

}
function frame(now){
 const dt=last?Math.min((now-last)/1000,.05):0;last=now;
 if(!document.hidden&&!paused&&speed>0){
  // Exponential easing keeps both acceleration and deceleration continuous.
  velocity+=(speed-velocity)*(1-Math.exp(-dt*4));

 draw(phase);requestAnimationFrame(frame);
}
