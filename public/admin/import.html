<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>导入文章 · 日常手帖</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="import-page"><a href="/admin/">← 返回文章管理</a><h1>把文章带进来。</h1><p>选择 Markdown（.md）文件，自动读取标题、日期、分组、摘要与正文。文件先在当前浏览器解析，进入编辑器后仍需你确认保存。</p><p>没有日期时使用今天；没有草稿标记时默认隐藏。文章中的本地图片需在编辑器另行上传。</p><label for="article">选择文章（最多 500 KB）</label><input id="article" type="file" accept=".md,text/markdown"><p id="status" role="alert"></p><pre id="preview" hidden></pre><button id="continue" disabled>进入编辑器</button><p><a href="/article-template.md" download>下载文章模板</a></p></main><script type="module" src="/admin/import.js?v=sections-1"></script></body></html>
