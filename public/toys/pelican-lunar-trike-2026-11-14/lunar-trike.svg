<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" data-paused="false">
<title id="title">鹈鹕的月面三轮车</title>
<desc id="desc">戴飞行帽、系橙色围巾的白鹈鹕，在靛紫色月原骑青绿色三轮车。车轮旋转，星光明灭，车后漂起一串月尘。</desc>
<style>
.wheel{transform-box:fill-box;transform-origin:center;animation:roll 1.8s linear infinite}
.ride{animation:float 2.4s ease-in-out infinite}
.scarf{transform-box:fill-box;transform-origin:100% 65%;animation:flap 1.15s ease-in-out infinite alternate}
.moon-dust{transform-box:fill-box;transform-origin:center;animation:drift 2.5s ease-out infinite}
.twinkle{animation:twinkle 4s ease-in-out infinite alternate}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flap{to{transform:rotate(7deg) skewY(3deg)}}
@keyframes drift{0%{transform:translate(45px,8px);opacity:0}26%{opacity:.82}100%{transform:translate(-80px,-34px) scale(.7);opacity:0}}
@keyframes twinkle{0%,30%{opacity:.34}100%{opacity:1}}
svg[data-paused="true"] *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.wheel,.ride,.scarf,.moon-dust,.twinkle{animation:none!important}}
</style>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#161430"/><stop offset=".68" stop-color="#452f61"/><stop offset="1" stop-color="#956a97"/></linearGradient>
  <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#a08dba"/><stop offset="1" stop-color="#554c78"/></linearGradient>
  <linearGradient id="white" x2=".15" y2="1"><stop stop-color="#fff6dc"/><stop offset=".63" stop-color="#f6e6d7"/><stop offset="1" stop-color="#c9aecc"/></linearGradient>
  <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#ffd980"/><stop offset="1" stop-color="#ef9268"/></linearGradient>
  <radialGradient id="planet" cx=".31" cy=".28" r=".78"><stop stop-color="#aff3e1"/><stop offset=".7" stop-color="#60b3c3"/><stop offset="1" stop-color="#496699"/></radialGradient>
  <clipPath id="orbclip"><circle cx="753" cy="161" r="77"/></clipPath>
  <pattern id="dither" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" fill="#f8e2ff" opacity=".38"/><circle cx="6" cy="5" r=".44" fill="#150e31" opacity=".46"/></pattern>
  <g id="spark" fill="none" stroke="#ffe5aa" stroke-width="1.5" stroke-linecap="round"><path d="M0-8v16M-8 0h16"/><circle r="2.1" fill="#ffe5aa" stroke="none"/></g>
  <g id="wheel">
    <circle r="53" fill="#312440" stroke="#eed2b7" stroke-width="2"/>
    <circle r="45" fill="#403452" stroke="#7b6b8a" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle r="37" fill="#5b4970" stroke="#c8b8ac" stroke-width="4"/>
    <path d="M0-36v72M-36 0h72M-25-25l50 50m0-50-50 50" stroke="#d9c4b6" stroke-width="2.2"/>
    <circle r="11" fill="#86cfb3" stroke="#312440" stroke-width="3"/><circle r="3.8" fill="#ffe9b6"/>
  </g>
</defs>
<!-- inked frame and layered lunar terrain -->
