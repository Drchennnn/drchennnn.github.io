<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" id="pelican-art" role="group" aria-labelledby="art-title art-desc">
<title id="art-title">鹈鹕的彗星夜航</title>
<desc id="art-desc">真正的白鹈鹕穿着灯塔守夜人的黄色油布雨衣，戴渔夫帽，长喙和宽大的喉囊朝向左方。它提着一盏暖光航灯，蹲坐在一架由彗星牵引的黄铜雪橇上，掠过极夜海面。青绿色极光在背后舒展，雪橇右方拖着流动的星光尾迹。全部画面由原创矢量路径绘制。</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#0c2441"/><stop offset=".6" stop-color="#174a60"/><stop offset="1" stop-color="#43757a"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#164958"/><stop offset="1" stop-color="#081f35"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9cd6bd" stop-opacity="0"/><stop offset=".6" stop-color="#8ed3b3" stop-opacity=".24"/><stop offset="1" stop-color="#a8e1be" stop-opacity=".6"/></linearGradient>
 <linearGradient id="brass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffdaa0"/><stop offset=".55" stop-color="#ca955e"/><stop offset="1" stop-color="#9e624a"/></linearGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe19c"/><stop offset=".5" stop-color="#edb951"/><stop offset="1" stop-color="#c48735"/></linearGradient>
 <linearGradient id="feather" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fffae8"/><stop offset="1" stop-color="#bdd5cf"/></linearGradient>
 <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#df8a53"/><stop offset=".55" stop-color="#f2bf72"/><stop offset="1" stop-color="#ffe3a1"/></linearGradient>
 <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4cd90"/><stop offset="1" stop-color="#d89168"/></linearGradient>
 <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8e7ad" stop-opacity=".9"/><stop offset=".5" stop-color="#91d3c3" stop-opacity=".5"/><stop offset="1" stop-color="#90cfd1" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffe3a1" stop-opacity=".46"/><stop offset="1" stop-color="#ffe3a1" stop-opacity="0"/></radialGradient>
 <radialGradient id="comet-glow"><stop stop-color="#e7ecca" stop-opacity=".35"/><stop offset="1" stop-color="#99d4c7" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#f9e9b9" opacity=".1"/></pattern>
 <clipPath id="canvas"><rect x="28" y="28" width="1544" height="1044" rx="26"/></clipPath>
 <g id="spark"><path d="M0-10Q2-2 10 0Q2 2 0 10Q-2 2-10 0Q-2-2 0-10Z" fill="#efe5b2"/></g>
 <g id="snowflake" stroke="#b9dacc" stroke-width="1.4" stroke-linecap="round"><path d="M-7 0H7M0-7V7M-5-5 5 5M-5 5 5-5"/></g>
 <g id="rivet"><circle r="5" fill="#754e40"/><circle cx="-1" cy="-1" r="2.3" fill="#ffe1a2"/></g>
 <style>
 .ink{stroke:#203747;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#38525a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
 #voyager{animation:glide 6s ease-in-out infinite;transform-origin:800px 680px}#aurora-ribbon{animation:aurora-drift 12s ease-in-out infinite;transform-origin:1000px 200px}.trail-lines{animation:streak 4s linear infinite;stroke-dasharray:28 36}#lamp{animation:lamp-swing 4.8s ease-in-out infinite;transform-origin:699px 535px}.lamp-halo{animation:lamp-glow 6s ease-in-out infinite}.star-drift{animation:star-drift 9s ease-in-out infinite}.star-drift.two{animation-delay:-4.5s}#eye{animation:blink 8s infinite;transform-box:fill-box;transform-origin:center}#ribbon{animation:ribbon 3.7s ease-in-out infinite;transform-origin:913px 507px}.twinkle{animation:twinkle 5s ease-in-out infinite}.wake{animation:wake 6s ease-in-out infinite;transform-origin:800px 924px}
 svg[data-motion="paused"] .moving{animation-play-state:paused!important}#svg-toggle{display:none;cursor:pointer}#svg-toggle:focus-visible{outline:none}#svg-toggle:focus-visible rect{stroke:#fff1b5;stroke-width:4}
 @keyframes glide{0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(-10px,-15px) rotate(1deg)}}
 @keyframes aurora-drift{0%,100%{transform:translateY(0) scaleY(1);opacity:.7}50%{transform:translateY(-14px) scaleY(1.06);opacity:1}}
 @keyframes streak{to{stroke-dashoffset:-128}}
 @keyframes lamp-swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
 @keyframes lamp-glow{0%,100%{opacity:.7}50%{opacity:1}}
 @keyframes star-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(16px,-12px)}}
 @keyframes blink{0%,39%,43%,100%{transform:scaleY(1)}41%{transform:scaleY(.1)}}
 @keyframes ribbon{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}
 @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes wake{0%,100%{transform:scaleX(.96);opacity:.35}50%{transform:scaleX(1.04);opacity:.65}}
 @media(prefers-reduced-motion:reduce){.moving{animation:none!important}#svg-toggle{display:none!important}}
 </style>
</defs>
