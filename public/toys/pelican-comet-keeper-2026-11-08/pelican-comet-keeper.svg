<script><![CDATA[
(function(){const art=document.documentElement;if(art.localName!=='svg')return;const button=document.getElementById('svg-toggle'),label=document.getElementById('svg-toggle-label');const reduced=matchMedia('(prefers-reduced-motion: reduce)');let manual=false;function sync(){const stopped=manual||reduced.matches||document.hidden;art.setAttribute('data-motion',stopped?'paused':'on');button.setAttribute('aria-pressed',String(manual));button.setAttribute('aria-label',manual?'继续动画':'暂停动画');label.textContent=manual?'继续动画':'暂停动画';}function toggle(){manual=!manual;sync();}button.style.display='inline';button.addEventListener('click',toggle);button.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});reduced.addEventListener('change',sync);document.addEventListener('visibilitychange',sync);sync();})();
]]></script>
