<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" id="pelican-art" role="group" aria-labelledby="art-title art-desc">
<title id="art-title">鹈鹕的莲叶魔术航线</title>
<desc id="art-desc">一只真正的白鹈鹕，长长的橙黄色鸟喙下垂着柔软的喉囊。它穿紫色燕尾服，戴高礼帽，站在一艘由巨大莲叶改造的气垫船上。莲叶下的气泡托起船身，后方的小风扇转动；鹈鹕用魔杖把小鱼变进漂浮的水泡里，在黄昏荷塘中缓缓巡航。原创路径绘制，循环动画包含在 SVG 内部。</desc>
<defs>
 <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292748"/><stop offset=".6" stop-color="#595376"/><stop offset="1" stop-color="#be8e96"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#465f70"/><stop offset="1" stop-color="#152f40"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#a7c5a0"/><stop offset=".45" stop-color="#648f83"/><stop offset="1" stop-color="#386c6e"/></linearGradient>
 <linearGradient id="leaf-edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#345b60"/><stop offset="1" stop-color="#1c3c4c"/></linearGradient>
 <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e6"/><stop offset="1" stop-color="#c6d9d1"/></linearGradient>
 <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe3a0"/><stop offset=".75" stop-color="#efb45e"/><stop offset="1" stop-color="#db8558"/></linearGradient>
 <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0c786"/><stop offset="1" stop-color="#dc996f"/></linearGradient>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#927bba"/><stop offset=".6" stop-color="#685287"/><stop offset="1" stop-color="#483b69"/></linearGradient>
 <radialGradient id="bubble"><stop offset=".3" stop-color="#e8f6e1" stop-opacity=".04"/><stop offset=".8" stop-color="#cbe4d1" stop-opacity=".15"/><stop offset="1" stop-color="#e6e0b5" stop-opacity=".4"/></radialGradient>
 <radialGradient id="halo"><stop stop-color="#ffe4ae" stop-opacity=".2"/><stop offset="1" stop-color="#ffe4ae" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".7" fill="#fff0cc" opacity=".1"/></pattern>
 <clipPath id="paper"><rect x="28" y="28" width="1344" height="1044" rx="25"/></clipPath>
 <g id="spark"><path d="M0-10Q2-2 10 0Q2 2 0 10Q-2 2-10 0Q-2-2 0-10Z" fill="#f9dfa4"/></g>
 <g id="fish" stroke="#644b59" stroke-width="2.5" stroke-linejoin="round"><path d="M-24 0C-11-22 20-19 32 0C20 19-11 22-24 0L-42 15-39-15Z" fill="#efbd79"/><path d="m-4-13 13-12 8 14M-3 14l11 10 10-13" fill="#dc8e72"/><path d="M16-10q-9 10 0 20" fill="none"/><circle cx="23" cy="-3" r="3" fill="#2a3549" stroke="none"/></g>
 <g id="bubble-small"><circle r="14" fill="url(#bubble)" stroke="#b7d9cb" stroke-width="1.5"/><path d="M-8-6q4-6 10-4" fill="none" stroke="#edf0ca" stroke-width="2" stroke-linecap="round"/></g>
 <style>
 .ink{stroke:#29374b;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}.fine{fill:none;stroke:#2e4352;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .moving{animation-play-state:running}#hovercraft{animation:hover 5.6s ease-in-out infinite;transform-origin:700px 700px}#fan-blades{animation:spin 1.8s linear infinite;transform-origin:0 0}.fish-bubble{animation:float-bubble 6.8s ease-in-out infinite}.fish-bubble.second{animation-delay:-3.4s}.lift-bubble{animation:lift 3.4s ease-in-out infinite}.lift-bubble.b2{animation-delay:-1.1s}.lift-bubble.b3{animation-delay:-2.2s}#coat-tails{animation:tails 3.1s ease-in-out infinite;transform-origin:635px 642px}#eye{animation:blink 7s infinite;transform-box:fill-box;transform-origin:center}.twinkle{animation:twinkle 4.8s ease-in-out infinite}.wake{animation:wake 5.6s ease-in-out infinite;transform-origin:700px 901px}
 svg[data-motion="paused"] .moving{animation-play-state:paused!important}
 #svg-toggle{display:none;cursor:pointer}#svg-toggle:focus-visible{outline:none}#svg-toggle:focus-visible rect{stroke:#fff6c8;stroke-width:4}
 @keyframes hover{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-14px) rotate(.6deg)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes float-bubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
 @keyframes lift{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-13px);opacity:1}}
 @keyframes tails{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3deg)}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
 @keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes wake{0%,100%{transform:scaleX(.98);opacity:.45}50%{transform:scaleX(1.04);opacity:.8}}
 @media(prefers-reduced-motion:reduce){.moving{animation:none!important}#svg-toggle{display:none!important}}
 </style>
</defs>
<rect width="1400" height="1100" fill="#efe5d1"/>
