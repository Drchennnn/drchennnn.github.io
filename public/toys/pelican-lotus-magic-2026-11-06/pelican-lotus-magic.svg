 <g fill="#e0dbc0" font-family="sans-serif" font-size="12" letter-spacing="2"><text x="322" y="1032">莲叶气垫船 × 紫色燕尾服与高礼帽</text><text x="1085" y="1032" text-anchor="end">ORIGINAL SVG · HKT</text></g>
