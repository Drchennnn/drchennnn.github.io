 <g transform="translate(1240 110)" fill="#eadcc2"><circle r="47" fill="none" stroke="#bfb2aa"/><text y="-9" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="2">每日奇想</text><text y="22" text-anchor="middle" font-family="Georgia,serif" font-size="32">002</text></g>
