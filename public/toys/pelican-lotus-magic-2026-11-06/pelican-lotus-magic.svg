<g id="svg-toggle" role="button" tabindex="0" aria-label="暂停动画" aria-pressed="false" transform="translate(1120 215)"><rect width="180" height="45" rx="23" fill="#29374b" stroke="#c6b999" stroke-width="1.5"/><text id="svg-toggle-label" x="90" y="29" text-anchor="middle" fill="#f4e7c8" font-family="sans-serif" font-size="16">暂停动画</text></g>
<script><![CDATA[
(function(){
 const art=document.documentElement;
 if(art.localName!=='svg')return;
 const button=document.getElementById('svg-toggle'),label=document.getElementById('svg-toggle-label');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)'); let manual=false;
 function sync(){const stopped=manual||reduced.matches||document.hidden;art.setAttribute('data-motion',stopped?'paused':'on');button.setAttribute('aria-pressed',String(manual));button.setAttribute('aria-label',manual?'继续动画':'暂停动画');label.textContent=manual?'继续动画':'暂停动画';}
 function toggle(){manual=!manual;sync();}
 button.style.display='inline';button.addEventListener('click',toggle);button.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});reduced.addEventListener('change',sync);document.addEventListener('visibilitychange',sync);sync();
})();
]]></script>
</svg>