  <g fill="none" stroke="#b2c9a0" stroke-width="2.5" opacity=".8"><path d="M731 744 431 712M731 744 381 748M731 744 486 787M731 744 633 806M731 744 808 807M731 744 968 788M731 744 1057 697M731 744 917 677M731 744 768 665M731 744 624 675"/><path d="m507 722-22-27m84 39-28-39m-72 56-48 17m177-30-49 35m97-16-42 12m204-26 75 17m-28-36 65 3m-45-19 56-8m-86-10 30-18"/></g>
