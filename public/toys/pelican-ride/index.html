<section class="controls" aria-label="动画控制"><button class="toggle" id="pause" type="button" aria-label="暂停骑行" data-paused="false"><span class="pause-icon" aria-hidden="true"></span></button><div class="speed-control"><div class="label-row"><label for="speed">骑行速度</label><output class="value" id="speedValue" for="speed">1.0<small>×</small></output></div><input id="speed" type="range" min="0" max="3" step="0.1" value="1" style="--fill:33.333%" aria-valuetext="1.0 倍速"><div class="range-labels"><span>停下来</span><span>慢慢骑</span><span>追上风</span></div></div><div class="ride-state" aria-live="polite"><span>此刻的心情</span><div id="mood">悠哉兜风</div></div><span id="announcement" class="sr-only" aria-live="polite"></span></section>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), slider=$('speed'),button=$('pause');
const el=Object.fromEntries(['rearSpin','frontSpin','crank','farLeg','farFoot','nearLeg','nearFoot','nearPedal','sockSeam','rider','backHair','eyes','road','verge','clouds','breeze'].map(id=>[id,$(id)]));
let speed=1,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=null,hostPaused=false;
function controls(){
 $('speedValue').innerHTML=speed.toFixed(1)+'<small>×</small>';
 slider.style.setProperty('--fill',(speed/3*100)+'%');slider.setAttribute('aria-valuetext',speed.toFixed(1)+' 倍速');
 button.dataset.paused=String(paused||hostPaused);button.disabled=hostPaused;button.setAttribute('aria-label',hostPaused?'已随全站暂停，请在页脚开启动效':paused?'继续骑行':'暂停骑行');
 $('mood').textContent=hostPaused?'动效已暂停':paused?'歇一小会':speed===0?'看看风景':speed<.8?'慢慢悠悠':speed<1.6?'悠哉兜风':speed<2.5?'迎风前进':'快乐冲刺';
}
slider.addEventListener('input',()=>{speed=Number(slider.value);controls()});
button.addEventListener('click',()=>{paused=!paused;controls();$('announcement').textContent=paused?'骑行已暂停':'骑行已继续'});
function render(){
 const a=time*3.7,bob=Math.sin(a*2)*1.5,deg=time*180;
 el.rearSpin.setAttribute('transform',`rotate(${deg})`);el.frontSpin.setAttribute('transform',`rotate(${deg})`);
 el.crank.setAttribute('transform',`translate(509 451) rotate(${a*180/Math.PI})`);
 function leg(near){const phase=a+(near?0:Math.PI),x=509+30*Math.cos(phase),y=451+30*Math.sin(phase),hx=near?479:492,hy=370+bob;
 // Two rigid segments joined by a knee: inverse kinematics keeps boots on the pedals.
 const tx=x-4,ty=y-12,dx=tx-hx,dy=ty-hy,d=Math.hypot(dx,dy),l1=63,l2=62;
 const along=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-along*along));
 const kx=hx+dx*along/d+dy*h/d,ky=hy+dy*along/d-dx*h/d;
 el[near?'nearLeg':'farLeg'].setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${tx} ${ty}`);
 el[near?'nearFoot':'farFoot'].setAttribute('transform',`translate(${x} ${y-13})`);
 if(near){el.nearPedal.setAttribute('transform',`translate(${x} ${y+2})`);el.sockSeam.setAttribute('d',`M${kx+(tx-kx)*.7-8} ${ky+(ty-ky)*.7}l16 0`);}}
 leg(false);leg(true);
 el.rider.setAttribute('transform',`translate(0 ${bob})`);
 el.backHair.setAttribute('transform',`rotate(${Math.sin(a)*1.2} 480 210)`);
 const blink=time%5.3;el.eyes.setAttribute('transform',blink>5.12?'translate(0 233) scale(1 .08) translate(0 -233)':'');
 el.road.setAttribute('transform','');$('roadMarks').setAttribute('patternTransform',`translate(${-time*257%190} 0)`);
 el.verge.setAttribute('transform',`translate(${-time*257%1010} 0)`);
 el.clouds.setAttribute('transform',`translate(${-time*9%1100} 0)`);
 el.breeze.setAttribute('transform',`translate(${-time*50%32} 0)`);
 el.breeze.style.opacity=speed===0?0:Math.min(.85,speed*.38);
}
function frame(now){if(last!==null&&!paused&&!hostPaused&&!document.hidden)time+=Math.min((now-last)/1000,.05)*speed;last=now;render();requestAnimationFrame(frame)}
// The sandboxed embed accepts only its embedding window's motion command.
if (window.parent !== window) {
  const notifySize=()=>parent.postMessage({type:'toy:resize',height:Math.ceil(document.querySelector('.page').getBoundingClientRect().height)},'*');
  window.addEventListener('message',event=>{
    if(event.source!==parent||event.data?.type!=='journal:motion'||typeof event.data.paused!=='boolean')return;
    hostPaused=event.data.paused;last=null;controls();
  });
  new ResizeObserver(notifySize).observe(document.querySelector('.page'));
  parent.postMessage({type:'toy:ready'},'*');notifySize();
}
document.addEventListener('visibilitychange' ,()=>{last=null});controls();render();requestAnimationFrame(frame);
})();
</script></body></html>
