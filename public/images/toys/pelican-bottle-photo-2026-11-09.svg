<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" id="pelican-art" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">鹈鹕的瓶中摄影航线</title>
<desc id="art-desc">一只真正的白鹈鹕穿卡其摄影马甲、戴墨绿色贝雷帽，在巨大的透明玻璃瓶潜水艇里端起相机，为窗外的珊瑚色小鱼拍照。长鸟喙、宽喉囊、弯颈与橙色蹼足清晰可见。瓶口用木塞密封，尾部螺旋桨缓缓转动，气泡上浮，海草轻摆。画面由原创矢量路径和形状组成。</desc>
<defs>
 <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4e8d7"/><stop offset=".36" stop-color="#91c8b9"/><stop offset=".73" stop-color="#519f9e"/><stop offset="1" stop-color="#317d86"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f4d9" stop-opacity=".55"/><stop offset=".5" stop-color="#d7edd8" stop-opacity=".1"/><stop offset="1" stop-color="#c1e0cf" stop-opacity=".55"/></linearGradient>
 <linearGradient id="feather" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fffbea"/><stop offset="1" stop-color="#c6dacb"/></linearGradient>
 <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe1a0"/><stop offset=".65" stop-color="#efb467"/><stop offset="1" stop-color="#d98b59"/></linearGradient>
 <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4d294"/><stop offset="1" stop-color="#dc9c73"/></linearGradient>
 <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4cf9f"/><stop offset=".65" stop-color="#bdab7c"/><stop offset="1" stop-color="#8e8f69"/></linearGradient>
 <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2ac72"/><stop offset="1" stop-color="#9e7752"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f1d9a5"/><stop offset=".6" stop-color="#b89761"/><stop offset="1" stop-color="#857653"/></linearGradient>
 <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#284f5b"/><stop offset=".5" stop-color="#5e9e9d"/><stop offset="1" stop-color="#a5ccbe"/></linearGradient>
 <radialGradient id="bubble"><stop offset=".5" stop-color="#f7f4d3" stop-opacity="0"/><stop offset="1" stop-color="#ecf3d5" stop-opacity=".4"/></radialGradient>
 <pattern id="paper-grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#e9efd0" opacity=".12"/></pattern>
 <clipPath id="canvas"><rect x="28" y="28" width="1544" height="1044" rx="25"/></clipPath>
 <g id="fish" stroke="#3a6670" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-38 0C-16-34 29-28 54 0C30 29-17 34-38 0L-67 25-62-25Z" fill="#eaa08a"/><path d="m-9-23 22-20 17 22M-2 24l15 17 20-23" fill="#d68876"/><path d="M27-16q-14 17 0 33" fill="none"/><circle cx="38" cy="-4" r="4" fill="#254c57" stroke="none"/><path d="m-18-12 3 8m-4 10 4 8m6-22 3 9" fill="none" stroke="#f7cfb3" stroke-width="2"/></g>
 <g id="little-fish" fill="#d1ddb4"><path d="M-15 0Q0-17 22 0Q0 17-15 0L-28 12-27-11Z"/><circle cx="13" cy="-2" r="2" fill="#52838a"/></g>
 <g id="air"><circle r="18" fill="url(#bubble)" stroke="#dcebd0" stroke-width="1.5"/><path d="M-11-7q4-7 12-7" fill="none" stroke="#f9f5d9" stroke-width="2.5" stroke-linecap="round"/></g>
 <g id="leaf"><path d="M0 0C-54-21-72-68-35-99C-3-76 14-37 0 0Z" fill="#4f9c87" stroke="#326f75" stroke-width="2.5"/><path d="M-34-88Q-7-42 0 0" fill="none" stroke="#a0c5a2" stroke-width="2"/></g>
 <style>
 .ink{stroke:#2b535d;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}.fine{fill:none;stroke:#527575;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .light-ray{opacity:.22}
 #submarine{animation:sub-float 7s ease-in-out infinite;transform-origin:800px 550px}#propeller{animation:prop-turn 5s linear infinite;transform-origin:0 0}.fish-school{animation:fish-drift 9s ease-in-out infinite}.fish-school.two{animation-delay:-4.5s}.air-column{animation:bubble-rise 8s linear infinite}.air-column.second{animation-delay:-4s}.kelp{animation:kelp-sway 8s ease-in-out infinite;transform-origin:0 0}.kelp.second{animation-delay:-4s}#eye{animation:blink 8.5s infinite;transform-box:fill-box;transform-origin:center}.light-ray{animation:ray-breathe 12s ease-in-out infinite}#camera-shine{animation:lens-glow 5.5s ease-in-out infinite}.photo-focus{animation:focus-breathe 6s ease-in-out infinite}
 svg[data-motion="paused"] .moving{animation-play-state:paused!important}#svg-toggle{display:none;cursor:pointer}#svg-toggle:focus-visible{outline:none}#svg-toggle:focus-visible rect{stroke:#fff7d5;stroke-width:4}
 @keyframes sub-float{0%,100%{transform:translate(0,0) rotate(-.6deg)}50%{transform:translate(8px,-14px) rotate(.6deg)}}
 @keyframes prop-turn{to{transform:rotate(360deg)}}
 @keyframes fish-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,10px)}}
 @keyframes bubble-rise{0%{transform:translateY(25px);opacity:0}15%,75%{opacity:.8}100%{transform:translateY(-100px);opacity:0}}
 @keyframes kelp-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
 @keyframes blink{0%,51%,55%,100%{transform:scaleY(1)}53%{transform:scaleY(.1)}}
 @keyframes ray-breathe{0%,100%{opacity:.18}50%{opacity:.32}}
 @keyframes lens-glow{0%,100%{opacity:.4}50%{opacity:.85}}
 @keyframes focus-breathe{0%,100%{opacity:.3}50%{opacity:.75}}
 @media(prefers-reduced-motion:reduce){.moving{animation:none!important}#svg-toggle{display:none!important}}
 /* Gallery cover is intentionally static. */
 .moving{animation:none!important}
 </style>
</defs>
<rect width="1600" height="1100" fill="#f0e9d5"/>
<g clip-path="url(#canvas)">
