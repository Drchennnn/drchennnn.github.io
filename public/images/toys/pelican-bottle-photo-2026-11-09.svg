 <g fill="none" stroke="#eef0d0" stroke-width="2" opacity=".55"><path d="M52 80Q172 50 289 78T539 80T803 71T1065 78T1324 75T1580 74"/><path d="M93 94q95-22 159-7m839 6q107-23 184-1m67-4 137-3"/></g>
