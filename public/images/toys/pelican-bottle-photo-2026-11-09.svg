 <!-- Headline is printed above the glass shoulder, in the bright surface light. -->
 <g fill="#285861"><text x="103" y="144" font-family="sans-serif" font-size="15" letter-spacing="5">DAILY PELICAN / 2026.11.09</text><path d="M103 169h238" stroke="#638f8c"/><text x="99" y="238" font-family="'Noto Serif CJK SC','Noto Serif SC',serif" font-size="51" font-weight="600" letter-spacing="4">瓶中摄影航线</text><text x="105" y="280" font-family="Georgia,serif" font-size="17" letter-spacing="3">A LITTLE WINDOW INTO THE BLUE</text><text x="105" y="319" font-family="sans-serif" font-size="13" letter-spacing="2">今天，给路过的小鱼拍张照。</text></g>
 <g transform="translate(1464 142)" fill="#2d6670"><circle r="48" fill="none" stroke="#63968f"/><text y="-11" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="2">每日奇想</text><text y="23" text-anchor="middle" font-family="Georgia,serif" font-size="32">005</text></g>
