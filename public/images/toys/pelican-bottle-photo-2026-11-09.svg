   <path d="M792 519q30 76 105 116l88-82" fill="none" stroke="#365a61" stroke-width="13" stroke-linecap="round"/><path d="M797 524q31 73 100 106l84-78" fill="none" stroke="#8b9b84" stroke-width="3"/>
